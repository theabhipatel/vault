# Production-style stack: Postgres + API + web (nginx). Put TLS in front of `web`.
#   cp backend/.env.example .env.prod   # then edit: APP_URL, SECRET_KEY, SMTP_*, COOKIE_SECURE=true
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
name: vault-prod

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vault
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: vault
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vault -d vault"]
      interval: 5s
      retries: 20

  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env.prod
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://vault:${POSTGRES_PASSWORD}@postgres:5432/vault
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-29080}:8080"
    depends_on:
      - api

volumes:
  pgdata:
